apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uvicorn-route
spec:
  parentRefs:
    - name: uvicorn-gateway

  rules:
    - backendRefs:
        - name: uvicorn-app-v1
          port: 80
          weight: 90

        - name: uvicorn-app-v2
          port: 80
          weight: 10
