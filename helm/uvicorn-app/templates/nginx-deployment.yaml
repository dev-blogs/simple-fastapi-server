apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-proxy

  template:
    metadata:
      labels:
        app: nginx-proxy

    spec:
      containers:
        - name: nginx
          image: nginx:1.27

          ports:
            - containerPort: 443

          readinessProbe:
            tcpSocket:
              port: 443

          livenessProbe:
            tcpSocket:
              port: 443

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

            - name: tls-secret
              mountPath: /etc/nginx/tls
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

        - name: tls-secret
          secret:
            secretName: my-tls-secret
