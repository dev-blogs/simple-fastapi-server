apiVersion: apps/v1
kind: Deployment
metadata:
  name: https-proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: https-proxy
  template:
    metadata:
      labels:
        app: https-proxy
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 443
          
          volumeMounts:
            - name: tls-secret
              mountPath: /tls
              readOnly: true

      volumes:
        - name: tls-secret
          secret:
            secretName: my-tls-secret


