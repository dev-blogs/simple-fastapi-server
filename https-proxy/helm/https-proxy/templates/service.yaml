apiVersion: v1
kind: Service
metadata:
  name: https-proxy
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: {{ .Values.service.type }}
  loadBalancerIP: {{ .Values.internalIp }}
  selector:
    app: https-proxy
  ports:
    - name: https
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
